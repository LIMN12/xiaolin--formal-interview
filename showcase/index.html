<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusHub · 贡献日历 — GitHub 数据展示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/showcase.css">
</head>
<body data-page="calendar" class="vignette">

<!-- 全局颗粒噪点层 -->
<div class="grain" aria-hidden="true"></div>

<!-- 固定导航 -->
<header class="nav">
  <a class="nav__logo" href="index.html">C·H <b>LIMN12</b></a>
  <nav class="nav__menu">
    <a href="standings.html">Standings</a>
    <a href="https://github.com/LIMN12/xiaolin--formal-interview" target="_blank" rel="noopener">Repo</a>
    <button class="menu-btn" aria-label="菜单"><span></span><span></span><span></span></button>
  </nav>
</header>

<!-- Hero：条纹复古背景 + 巨型标题 -->
<section class="cal-hero">
  <div class="cal-hero__bg" aria-hidden="true" id="calArt"></div>
  <div class="cal-hero__veil"></div>
  <div class="cal-hero__content">
    <h1 class="cal-hero__title offset-text">ACTIVITIES</h1>
    <p class="cal-hero__sub" data-cal-sub>校园活动台 CampusHub · 活动日历 2026</p>
  </div>
</section>

<!-- 单月大日历 -->
<section class="cal-section">
  <div class="cal-section__head">
    <h2 class="cal-section__title offset-ink">
      <small>C·H 16 · LIMN12 · 2026</small>
      Campus Activity Calendar
    </h2>
  </div>

  <!-- 月份导航 -->
  <div class="cal-nav">
    <button class="cal-nav__btn" data-prev aria-label="上一月">←</button>
    <div class="cal-nav__label" data-cal-month>September 2026</div>
    <button class="cal-nav__btn" data-next aria-label="下一月">→</button>
  </div>

  <!-- 大日历网格 -->
  <div class="cal-big" data-cal-big>
    <!-- JS 注入：当前月 7 列大日历 -->
  </div>

  <div class="cal-legend" aria-hidden="true">
    <span>当日活动数</span>
    <i class="lg0"></i><i class="lg1"></i><i class="lg2"></i><i class="lg3"></i>
    <span>3+</span>
    <span style="margin-left:1.4rem">点击日期查看活动详情</span>
  </div>
</section>

<!-- 悬浮活动详情框 -->
<div class="cal-popup" id="calPopup" hidden>
  <div class="cal-popup__head">
    <span class="cal-popup__date" id="popupDate">—</span>
    <button class="cal-popup__close" id="popupClose" aria-label="关闭">×</button>
  </div>
  <div class="cal-popup__body" id="popupBody">
    <!-- JS 注入：当天活动列表 -->
  </div>
  <div class="cal-popup__add">
    <button class="cal-popup__addbtn" id="popupAdd">+ 添加活动</button>
  </div>
</div>

<!-- 活动一览：按日期分组 -->
<section class="cal-section cal-section--dark">
  <div class="cal-section__head">
    <h2 class="cal-section__title offset-text">
      <small>Activities by Date</small>
      Upcoming &amp; Ongoing
    </h2>
  </div>
  <div class="cal-timeline" data-cal-events>
    <!-- JS 注入：活动按日期分组列表 -->
  </div>
</section>

<footer class="footer">
  CampusHub Showcase · 活动日历展示页 · 复古胶片质感 · 支持自定义活动持续更新
</footer>

<!-- Hero 条纹复古背景（纯矢量） -->
<script>
document.getElementById("calArt").innerHTML = `<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
  <defs><pattern id="hs" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="22" cy="22" r="1.4" fill="#1A0A00" opacity="0.16"/></pattern></defs>
  <rect width="800" height="600" fill="#1A0A00"/>
  ${Array.from({length:8},(_,i)=>`<rect y="${i*75}" width="800" height="75" fill="${["#8B2500","#6B1F00","#B8860B","#6B8E23","#CC5500","#191970","#1A0A00","#8B2500"][i]}" opacity="0.94"/>`).join("")}
  <rect width="800" height="600" fill="url(#hs)"/>
  <circle cx="640" cy="170" r="96" fill="#DAA520" opacity="0.86"/>
  <circle cx="640" cy="170" r="54" fill="#8B2500"/>
  ${Array.from({length:14},(_,i)=>`<rect x="${20+i*56}" y="540" width="36" height="20" fill="${["#D2B48C","#B8860B","#6B8E23","#CC5500"][i%4]}" opacity="0.7"/>`).join("")}
</svg>`;
</script>

<script src="js/showcase.js"></script>
</body>
</html>
